<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease App</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://i.imgur.com; style-src 'self'; script-src 'self' 'unsafe-eval'">
  <link rel="icon" type="image/jpeg" href="https://i.imgur.com/QWLMgK8.jpeg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/fieldset.css">
  <link rel="stylesheet" href="css/input.css">
  <link rel="stylesheet" href="css/choice.css">
  <link rel="stylesheet" href="css/segmented.css">
  <link rel="stylesheet" href="css/button.css">
  <link rel="stylesheet" href="css/vendor/quill.core.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/clone.css">
  <link rel="stylesheet" href="css/splitter.css">
  <link rel="stylesheet" href="css/report.css">
  <script defer src="js/vendor/quill.min.js"></script>
  <script defer src="js/boot-guard.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body class="is-loading" aria-busy="true">

  <aside class="rail" aria-label="Site and networks">
    <a class="rail__brand" href="https://nstoolkits.site/veee3/">
      <span class="rail__mark" aria-hidden="true"><img src="img/ease-logo.png" alt="" width="160" height="134"></span>
      <span class="rail__label rail__title">Ease <span class="rail__title-accent">App</span></span>
    </a>

    <nav class="rail__group" aria-label="Networks">
      <p class="rail__heading">Networks</p>
      <div class="skeleton skeleton--rail" aria-hidden="true">
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
        <span class="sk-tile"></span>
      </div>
      <ul class="rail__list" x-data="sidebar">
        <template x-for="net in networks" :key="net.id">
          <li :class="{ 'is-null-off': isNullOff(net.id) }" :inert="isNullOff(net.id)"
              :title="isNullOff(net.id) ? 'Not used in a Null report' : null"
              @clone:change.window="$event.detail.id === net.id && reveal(net.id)">
            <div class="net-row">
              <label class="net" :data-net="net.id" :style="{ '--brand-color': net.color }">
                <input class="net__input" type="checkbox"
                       :checked="isChecked(net.id)" :disabled="isLocked(net.id)"
                       @change="toggle(net.id, $event.target.checked)">
                <span class="net__tile" aria-hidden="true" x-text="net.short"></span>
                <span class="net__count" aria-hidden="true" x-show="total(net.id) > 1" x-text="total(net.id)"></span>
                <span class="net__name rail__label" x-text="net.name"></span>
                <span class="net__switch" aria-hidden="true"></span>
              </label>
              <button type="button" class="btn btn--icon net-row__add"
                      x-show="isChecked(net.id)" @click="addClone(net.id)"
                      :aria-label="'Add another ' + net.name">+</button>
            </div>
            <ul class="clones" :data-clones="net.id" x-show="clones(net.id).length">
              <template x-for="(inst, i) in clones(net.id)" :key="inst.id">
                <li class="net-row net-row--clone" :aria-current="isOpenClone(net.id, i + 1)">
                  <button type="button" class="clone__name" @click="selectClone(net.id, i + 1)"
                          x-text="cloneLabel(net, inst, i + 2)" :title="cloneLabel(net, inst, i + 2)"></button>
                  <button type="button" class="btn btn--icon btn--ghost btn--danger"
                          @click="removeClone(net.id, i + 1)"
                          :aria-label="'Remove ' + cloneLabel(net, inst, i + 2)">&minus;</button>
                </li>
              </template>
            </ul>
          </li>
        </template>
      </ul>
    </nav>

    <nav class="rail__group rail__group--links" aria-label="Site">
      <ul class="rail__list">
        <li><a class="rail__link" href="https://nstoolkits.site/veee3/"><span class="rail__glyph" aria-hidden="true">H</span><span class="rail__label">Home</span></a></li>
        <li><a class="rail__link" href="https://nstoolkits.site/veee3/about.html"><span class="rail__glyph" aria-hidden="true">A</span><span class="rail__label">About us</span></a></li>
        <li><a class="rail__link" href="https://nstoolkits.site/veee3/download.html"><span class="rail__glyph" aria-hidden="true">D</span><span class="rail__label">Download</span></a></li>
        <li><a class="rail__link" href="https://nstoolkits.site/"><span class="rail__glyph" aria-hidden="true">V2</span><span class="rail__label">Version 2</span></a></li>
      </ul>
    </nav>
  </aside>

  <div class="stage">
    <div class="workspace" x-data="splitter">
      <section class="form" aria-labelledby="form-title">
        <h2 class="pane__title" id="form-title">Fill up form</h2>
        <!-- Startup skeleton: visible only while body.is-loading (css/skeleton.css) -->
        <div class="skeleton" aria-hidden="true">
          <div class="sk-section">
            <div class="sk-head"><span class="sk-bar sk-w-30"></span><span class="sk-dot"></span></div>
            <div class="sk-body"><span class="sk-block"></span><span class="sk-block sk-w-70"></span></div>
          </div>
          <div class="sk-section"><div class="sk-head"><span class="sk-bar sk-w-40"></span><span class="sk-dot"></span></div></div>
          <div class="sk-section"><div class="sk-head"><span class="sk-bar sk-w-55"></span><span class="sk-dot"></span></div></div>
        </div>
        <div id="form-sections" x-data="formAccordion"><!-- built by js/core/form-builder.js --></div>
      </section>

      <div class="splitter" role="separator" aria-orientation="vertical" tabindex="0"
           aria-label="Resize form and report"
           :aria-valuenow="shown" :aria-valuemin="Math.ceil(min)" :aria-valuemax="Math.floor(max)"
           :class="{ 'is-dragging': dragging }"
           @pointerdown="start($event)" @pointermove="move($event)"
           @pointerup="end($event)" @pointercancel="end($event)"
           @keydown="key($event)" @dblclick="reset()"></div>

      <main class="report" aria-labelledby="report-title">
        <header class="report__head">
          <h2 class="pane__title" id="report-title">Generated report</h2>
          <div class="report__actions">
            <button type="button" class="btn btn--danger" data-action="discard" disabled>Discard all</button>
            <button type="button" class="btn btn--primary" data-action="copy" disabled>Copy report</button>
            <span class="sr-only" id="report-status" role="status"></span>
          </div>
        </header>
        <div class="report__sheet" id="report-output" aria-live="polite">
          <div class="skeleton" aria-hidden="true">
            <div class="sk-bullet"><div class="sk-lines"><span class="sk-bar sk-w-85"></span><span class="sk-bar"></span><span class="sk-bar sk-w-55"></span></div></div>
            <div class="sk-bullet"><div class="sk-lines"><span class="sk-bar"></span><span class="sk-bar sk-w-70"></span></div></div>
            <div class="sk-bullet"><div class="sk-lines"><span class="sk-bar sk-w-85"></span><span class="sk-bar"></span><span class="sk-bar sk-w-40"></span></div></div>
          </div>
          <p class="report__empty" x-show="!$store.report.html">Your report will appear here once the form has data.</p>
          <div class="report__body" x-show="$store.report.html" x-html="$sanitize($store.report.html)"></div>
        </div>
      </main>
    </div>

    <footer class="footer">© 2026 NS Tool Kits v4 | Made by Morvan Hsu</footer>
  </div>

</body>
</html>
