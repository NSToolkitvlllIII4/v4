<!-- Account stepper, added to the top of every network section by js/core/form-builder.js.
     Hidden while the network has a single account. Logic: js/components/clone-stepper.js -->
<div class="clone-stepper" x-data="cloneStepper('__NET__')" x-show="total > 1" role="group" :aria-label="net.name + ' accounts'">
  <button type="button" class="btn btn--icon" :disabled="current <= 1" @click="go(current - 1)" aria-label="Previous account">&lsaquo;</button>
  <div class="clone-stepper__jump">
    <span class="clone-stepper__name" x-text="net.name"></span>
    <input class="input" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Go to account number"
           :value="current" @input="filter($event)" @keydown="key($event)" @blur="commit($event)" @focus="$event.target.select()">
    <span x-text="'of ' + total"></span>
  </div>
  <button type="button" class="btn btn--icon" :disabled="current >= total" @click="go(current + 1)" aria-label="Next account">&rsaquo;</button>
</div>
