<!-- Report type section. Bound to $store.form (js/stores/form.js). -->
<fieldset class="fieldset">
  <legend>Report version</legend>
  <div class="segmented">
    <label class="segmented__opt">
      <input type="radio" name="report-type" value="plus" x-model="$store.form.reportType"><span>Plus</span>
    </label>
    <label class="segmented__opt">
      <input type="radio" name="report-type" value="progressive" x-model="$store.form.reportType"><span>Progressive</span>
    </label>
  </div>
</fieldset>

<fieldset class="fieldset">
  <legend>Null?</legend>
  <div class="choice-group">
    <label class="choice">
      <input type="radio" name="null-status" :checked="$store.form.isNull" @change="$store.form.isNull = true"> Yes
    </label>
    <label class="choice">
      <input type="radio" name="null-status" :checked="!$store.form.isNull" @change="$store.form.isNull = false"> No
    </label>
  </div>
</fieldset>
