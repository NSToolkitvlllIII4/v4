<!-- Google / public search engine results. One set of results at a time
     (the active entry of $store.networks.byId.goog). Logic: js/components/google-section.js -->
<div class="stack" x-data="googleSection">

  <fieldset class="fieldset">
    <legend>Search details</legend>
    <div class="stack">
      <div class="choice-group">
        <label class="choice"><input type="radio" :name="'goog-type-' + d.id" value="single" x-model="d.resultType"> 1 result</label>
        <label class="choice"><input type="radio" :name="'goog-type-' + d.id" value="multiple" x-model="d.resultType"> 2+ results</label>
      </div>
      <div class="input" x-link-field.raw="d.pseNames" data-placeholder="Search engine(s) (e.g. Mylife, Radaris)"></div>
    </div>
  </fieldset>

  <fieldset class="fieldset">
    <legend>Match &amp; ID</legend>
    <div class="stack">
      <div class="choice-group">
        <label class="choice"><input type="radio" :name="'goog-match-' + d.id" value="matched" x-model="d.matchStatus"> Matched</label>
        <label class="choice"><input type="radio" :name="'goog-match-' + d.id" value="possible" x-model="d.matchStatus"> Possible</label>
      </div>
      <div class="input" x-link-field="d.idBy" data-placeholder="Identified by (e.g. Visual match, URL)"></div>
    </div>
  </fieldset>

  <fieldset class="fieldset">
    <legend>Account presence</legend>
    <div class="choice-group">
      <label class="choice"><input type="radio" :name="'goog-acc-' + d.id" value="personal" x-model="d.accountType"> Personal</label>
      <label class="choice"><input type="radio" :name="'goog-acc-' + d.id" value="personal-page" x-model="d.accountType"> Personal page</label>
      <label class="choice"><input type="radio" :name="'goog-acc-' + d.id" value="business" x-model="d.accountType"> Business website</label>
      <label class="choice"><input type="radio" :name="'goog-acc-' + d.id" value="business-page" x-model="d.accountType"> Business page</label>
      <label class="choice"><input type="radio" :name="'goog-acc-' + d.id" value="no-page" x-model="d.accountType"> Public</label>
    </div>
  </fieldset>

  <fieldset class="fieldset" x-show="d.accountType === 'no-page'">
    <legend>Identified on</legend>
    <div class="choice-group">
      <label class="choice"><input type="radio" :name="'goog-media-' + d.id" value="public post/s" x-model="d.mentionMedia"> Public post/s</label>
      <label class="choice"><input type="radio" :name="'goog-media-' + d.id" value="public photo/s" x-model="d.mentionMedia"> Public photo/s</label>
      <label class="choice"><input type="radio" :name="'goog-media-' + d.id" value="public video/s" x-model="d.mentionMedia"> Public video/s</label>
    </div>
  </fieldset>


  <fieldset class="fieldset">
    <legend>Information found</legend>
    <div class="choice-group">
      <label class="choice"><input type="checkbox" x-model="d.infoPersonal"> Personal</label>
      <label class="choice"><input type="checkbox" x-model="d.infoEmployment"> Employment</label>
      <label class="choice"><input type="checkbox" x-model="d.infoCriminal"> Criminal</label>
      <label class="choice"><input type="checkbox" x-model="d.infoEducation"> Education</label>
    </div>
  </fieldset>

  <!-- Plus report -->
  <fieldset class="fieldset" x-show="isPlus">
    <legend>Findings</legend>
    <div class="stack">
      <div class="choice-group">
        <label class="choice"><input type="radio" :name="'goog-find-' + d.id" value="relevant" x-model="d.finding"> Relevant info</label>
        <label class="choice"><input type="radio" :name="'goog-find-' + d.id" value="none" x-model="d.finding"> No relevant info</label>
      </div>
      <input class="input" type="text" placeholder="Type of media &amp; RH details (e.g. 2 photos relating to...)"
             x-show="d.finding === 'relevant'" x-model="d.mediaType">
    </div>
  </fieldset>

  <!-- Progressive report -->
  <fieldset class="fieldset" x-show="!isPlus">
    <legend>Progressive findings</legend>
    <div class="stack">
      <template x-for="(f, i) in d.progFindings" :key="f.id">
        <fieldset class="fieldset fieldset--compact">
          <legend x-text="'Finding ' + (i + 1)"></legend>
          <div class="stack">
            <div class="choice-group">
              <label class="choice"><input type="radio" :name="'goog-pfind-' + f.id" value="none" x-model="f.type"> No findings found</label>
              <label class="choice"><input type="radio" :name="'goog-pfind-' + f.id" value="relevant" x-model="f.type"> Findings</label>
            </div>
            <textarea class="input" placeholder="Enter findings or text details here..." x-model="f.text"></textarea>
            <button type="button" class="btn btn--ghost btn--danger" @click="removeFinding(i)"
                    x-show="d.progFindings.length > 1">&minus; Remove this finding</button>
          </div>
        </fieldset>
      </template>
      <button type="button" class="btn btn--add" @click="addFinding()">+ Add another finding field</button>
    </div>
  </fieldset>

</div>
