<!-- Profile section. Bound to $store.form (js/stores/form.js). -->
<fieldset class="fieldset">
  <legend>Gender</legend>
  <div class="segmented">
    <label class="segmented__opt">
      <input type="radio" name="subject-gender" value="male" x-model="$store.form.subjectGender"><span>Male</span>
    </label>
    <label class="segmented__opt">
      <input type="radio" name="subject-gender" value="female" x-model="$store.form.subjectGender"><span>Female</span>
    </label>
  </div>
</fieldset>
