<!-- Relatives & associates. Bound to $store.form.relatives; logic in js/components/relatives.js. -->
<div class="stack" x-data="relativesSection">

  <fieldset class="fieldset">
    <legend>Identified relatives?</legend>
    <div class="choice-group">
      <label class="choice">
        <input type="radio" name="rel-status" :checked="r.found === true" @change="setFound(true)"> Yes
      </label>
      <label class="choice">
        <input type="radio" name="rel-status" :checked="r.found === false" @change="setFound(false)"> No
      </label>
    </div>
  </fieldset>

  <!-- Everything below only matters when relatives were found -->
  <div class="stack" x-show="r.found === true">

    <fieldset class="fieldset">
      <legend>Search scope</legend>
      <div class="choice-group">
        <label class="choice">
          <input type="radio" name="rel-scope" value="relatives" x-model="r.scope"> Relatives only
        </label>
        <label class="choice">
          <input type="radio" name="rel-scope" value="both" x-model="r.scope"> Relatives &amp; associates
        </label>
      </div>
    </fieldset>

    <fieldset class="fieldset">
      <legend>Names &amp; links</legend>
      <div class="stack">
        <template x-for="row in r.rows" :key="row.id">
          <div class="field-row">
            <input class="input" type="text" placeholder="Enter name" x-model="row.name">
            <input class="input" type="text" data-type="hyperlink" placeholder="Paste URL / hyperlink" x-model="row.link">
          </div>
        </template>
        <div class="actions">
          <button type="button" class="btn btn--add" @click="addRow()">+ Add another</button>
          <button type="button" class="btn btn--danger" @click="removeRow()" x-show="r.rows.length > 1">&minus; Remove recent</button>
        </div>
      </div>
    </fieldset>

    <!-- Plus report -->
    <fieldset class="fieldset" x-show="$store.form.reportType === 'plus'">
      <legend>Findings</legend>
      <div class="stack">
        <div class="choice-group">
          <label class="choice">
            <input type="radio" name="rel-findings" value="relevant" x-model="r.finding"> Relevant info
          </label>
          <label class="choice">
            <input type="radio" name="rel-findings" value="none" x-model="r.finding"> No relevant info
          </label>
        </div>
        <input class="input" type="text" placeholder="Details (e.g. 2 photos were found...)"
               x-show="r.finding === 'relevant'" x-model="r.rhText">
      </div>
    </fieldset>

    <!-- Progressive report -->
    <fieldset class="fieldset" x-show="$store.form.reportType === 'progressive'">
      <legend>Progressive findings</legend>
      <div class="stack">
        <template x-for="(f, i) in r.progFindings" :key="f.id">
          <fieldset class="fieldset fieldset--compact">
            <legend x-text="'Finding ' + (i + 1)"></legend>
            <div class="stack">
              <div class="choice-group">
                <label class="choice">
                  <input type="radio" :name="'rel-pfind-' + f.id" value="none" x-model="f.type"> No findings found
                </label>
                <label class="choice">
                  <input type="radio" :name="'rel-pfind-' + f.id" value="relevant" x-model="f.type"> Findings
                </label>
              </div>
              <textarea class="input" placeholder="Enter findings or text details here..." x-model="f.text"></textarea>
              <button type="button" class="btn btn--ghost btn--danger" @click="removeFinding(i)"
                      x-show="r.progFindings.length > 1">&minus; Remove this finding</button>
            </div>
          </fieldset>
        </template>
        <button type="button" class="btn btn--add" @click="addFinding()">+ Add another finding field</button>
      </div>
    </fieldset>

  </div>
</div>
